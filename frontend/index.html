<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F1EB" />
    <title>AEROGUARD AI — Microgravity Combustion Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const doc = document.documentElement;
          const sidebar = document.querySelector('.sidebar');
          const menuBtn = document.querySelector('.mobile-menu-trigger');
          const data = {
            viewport: `${window.innerWidth}x${window.innerHeight}`,
            scrollWidth: doc.scrollWidth,
            innerWidth: window.innerWidth,
            overflow: doc.scrollWidth > window.innerWidth,
            sidebarTransform: sidebar ? window.getComputedStyle(sidebar).transform : null,
            menuBtnDisplay: menuBtn ? window.getComputedStyle(menuBtn).display : null,
          };
          console.log('[RESPONSIVE_CHECK]', JSON.stringify(data));
        }, 1200);
      });
    </script>
  </body>
</html>
